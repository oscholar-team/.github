name: 问题反馈
description: 报告可复现的产品问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请先搜索已有问题。此 Issue 公开可见，请勿填写密码、验证码、Token、未公开稿件或个人敏感信息。"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪个页面开始、进行了哪些操作？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏截图及错误提示。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      placeholder: 例如 Chrome / macOS，或微信小程序 / iOS
    validations:
      required: true
